services:
  - type: web
    name: piromax-pass-fenapi
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PIROMAX_OPERATION_PIN
        sync: false
      - key: PIROMAX_DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: piromax-pass-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
